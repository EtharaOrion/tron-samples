volumes:
  shared: null
services:
  gym-itsm:
    image: shivakrishnareddyma225/enterpriseops-gym-mcp-itsm:latest
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import socket,sys; s=socket.socket(); s.settimeout(1); s.connect(('localhost',8006)); s.close()
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 10s
  gym-csm:
    image: shivakrishnareddyma225/enterpriseops-gym-mcp-csm:latest
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import socket,sys; s=socket.socket(); s.settimeout(1); s.connect(('localhost',8001)); s.close()
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 10s
  gym-hr:
    image: shivakrishnareddyma225/enterpriseops-gym-mcp-hr:latest
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import socket,sys; s=socket.socket(); s.settimeout(1); s.connect(('localhost',8008)); s.close()
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 10s
  gym-email:
    image: shivakrishnareddyma225/enterpriseops-gym-mcp-email:latest
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import socket,sys; s=socket.socket(); s.settimeout(1); s.connect(('localhost',8004)); s.close()
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 10s
  gym-calendar:
    image: shivakrishnareddyma225/enterpriseops-gym-mcp-calendar:latest
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import socket,sys; s=socket.socket(); s.settimeout(1); s.connect(('localhost',8003)); s.close()
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 10s
  gym-teams:
    image: shivakrishnareddyma225/enterpriseops-gym-mcp-teams:latest
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import socket,sys; s=socket.socket(); s.settimeout(1); s.connect(('localhost',8002)); s.close()
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 10s
  gym-drive:
    image: shivakrishnareddyma225/enterpriseops-gym-mcp-drive:latest
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import socket,sys; s=socket.socket(); s.settimeout(1); s.connect(('localhost',8009)); s.close()
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 10s
  seed-init:
    image: curlimages/curl:8.10.0
    depends_on:
      gym-itsm:
        condition: service_healthy
      gym-csm:
        condition: service_healthy
      gym-hr:
        condition: service_healthy
      gym-email:
        condition: service_healthy
      gym-calendar:
        condition: service_healthy
      gym-teams:
        condition: service_healthy
      gym-drive:
        condition: service_healthy
    volumes:
    - ./seeds:/seeds:ro
    - shared:/shared
    entrypoint:
    - /bin/sh
    - -c
    command: "set -e\napk add --no-cache jq >/dev/null\n\nseed_one() {\n  local gym_name=\"$$1\"\n  local host=\"$$2\"\n  local port=\"$$3\"\n  local seed_file=\"$$4\"\n  DB_ID=$$(curl -fsS -X POST -H \"Content-Type: application/sql\" \\\n    --data-binary @\"$$seed_file\" \\\n    \"http://$$host:$$port/api/seed\" | jq -r '.database_id')\n  test -n \"$$DB_ID\" && test \"$$DB_ID\" != \"null\"\n  printf '%s' \"$$DB_ID\" > \"/shared/database_id_$${gym_name}\"\n}\n\nseed_one \"gym-itsm-mcp\" gym-itsm 8006 /seeds/seed_itsm.sql\nseed_one \"sn-csm-server\" gym-csm 8001 /seeds/seed_csm.sql\nseed_one \"sn-hr-internal\" gym-hr 8008 /seeds/seed_hr.sql\nseed_one \"gym-email-mcp\" gym-email 8004 /seeds/seed_email.sql\nseed_one \"gym-calendar\" gym-calendar 8003 /seeds/seed_calendar.sql\nseed_one \"gym-teams-mcp\" gym-teams 8002 /seeds/seed_teams.sql\nseed_one \"gym-google-drive-mcp\" gym-drive 8009 /seeds/seed_drive.sql\n"
  mcp-injector:
    build: ./mcp-injector
    depends_on:
      seed-init:
        condition: service_completed_successfully
    volumes:
    - shared:/shared:ro
    environment:
      GYM_UPSTREAMS_JSON: '{"gym-itsm-mcp":"http://gym-itsm:8006/mcp","sn-csm-server":"http://gym-csm:8001/mcp","sn-hr-internal":"http://gym-hr:8008/mcp","gym-email-mcp":"http://gym-email:8004/mcp","gym-calendar":"http://gym-calendar:8003/mcp","gym-teams-mcp":"http://gym-teams:8002/mcp","gym-google-drive-mcp":"http://gym-drive:8009/mcp"}'
      GYM_CONTEXTS_JSON: '{"gym-itsm-mcp":{"x-itsm-user-token":"admin_token_marcus_2024_secure"},"sn-csm-server":{"x-user-email":"marcus.whitfield@northwind-fin.com"},"sn-hr-internal":{"x-hr-user-token":"hr_token_marcus_whitfield_042"},"gym-email-mcp":{"x-email-user-token":"tok_marcus_2025_wfld7q"},"gym-calendar":{"x-access-token":"tok_marcus.whitfield"},"gym-teams-mcp":{"x-teams-access-token":"ya29.marcus_wf_locked"},"gym-google-drive-mcp":{"x-auth-token":"JWT_MARCUS_WF"}}'
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import socket,sys; s=socket.socket(); s.settimeout(1); s.connect(('localhost',9000)); s.close()
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 5s
  main:
    build: .
    depends_on:
      mcp-injector:
        condition: service_healthy
    working_dir: /app
    tty: true
    volumes:
    - shared:/shared:ro
