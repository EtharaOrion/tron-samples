version = "1.0"

[task]
name = "default/2c744514-1e1d-520a-8df5-504c2b1d3bef"
description = "Karen - the Financial Conduct Registry letter is sitting in your mailbox from last week and Miriam handed this to me before she went on leave, so it comes to you. It names a reporting month and one of our merchant customers by their exact legal name, and the filing window shuts at the end of the month, which is why it can't wait until she's back. The standing procedure for putting one of these packages together is published in the knowledge base as KB0009301 - work through it properly and use the wording it dictates rather than your own, because the Registry reads these things literally. Fair warning that there are two copies of that procedure knocking about: the one we used for the March filing is still in there and half the team still opens that one by habit."

