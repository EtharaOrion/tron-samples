volumes:
  shared: null
services:
  gym-hr:
    image: shivakrishnareddyma225/enterpriseops-gym-mcp-hr:latest
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import socket,sys; s=socket.socket(); s.settimeout(1); s.connect(('localhost',8008)); s.close()
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 10s
  seed-init:
    image: curlimages/curl:8.10.0
    depends_on:
      gym-hr:
        condition: service_healthy
    volumes:
    - ./seeds:/seeds:ro
    - shared:/shared
    entrypoint:
    - /bin/sh
    - -c
    command: "set -e\napk add --no-cache jq >/dev/null\n\nseed_one() {\n  local gym_name=\"$$1\"\n  local host=\"$$2\"\n  local port=\"$$3\"\n  local seed_file=\"$$4\"\n  DB_ID=$$(curl -fsS -X POST -H \"Content-Type: application/sql\" \\\n    --data-binary @\"$$seed_file\" \\\n    \"http://$$host:$$port/api/seed\" | jq -r '.database_id')\n  test -n \"$$DB_ID\" && test \"$$DB_ID\" != \"null\"\n  printf '%s' \"$$DB_ID\" > \"/shared/database_id_$${gym_name}\"\n}\n\nseed_one \"sn-hr-internal\" gym-hr 8008 /seeds/seed_hr.sql\n"
  mcp-injector:
    build: ./mcp-injector
    depends_on:
      seed-init:
        condition: service_completed_successfully
    volumes:
    - shared:/shared:ro
    environment:
      GYM_UPSTREAMS_JSON: '{"sn-hr-internal":"http://gym-hr:8008/mcp"}'
      GYM_CONTEXTS_JSON: '{"sn-hr-internal":{"x-hr-token-access":"hr_token_sarah_chen_001"}}'
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import socket,sys; s=socket.socket(); s.settimeout(1); s.connect(('localhost',9000)); s.close()
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 5s
  main:
    build: .
    depends_on:
      mcp-injector:
        condition: service_healthy
    working_dir: /app
    tty: true
    volumes:
    - shared:/shared:ro
